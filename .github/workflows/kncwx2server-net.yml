name: KncWX2Server .NET Preview

on:
  push:
    paths:
      - 'KncWX2Server.Net/**'
      - '.github/workflows/kncwx2server-net.yml'
  pull_request:
    paths:
      - 'KncWX2Server.Net/**'
      - '.github/workflows/kncwx2server-net.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Restore
        run: dotnet restore KncWX2Server.Net/KncWX2Server.slnx
      - name: Build
        run: dotnet build KncWX2Server.Net/KncWX2Server.slnx -c Release --no-restore
